name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [develop, main]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  COMPOSE_FILE: docker-compose.prod.yml

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "env=production" >> "$GITHUB_OUTPUT"
          else
            echo "tag=develop" >> "$GITHUB_OUTPUT"
            echo "env=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Set lowercase image name
        id: img
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="${OWNER,,}"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/$owner/kuvox-ai" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.tag.outputs.tag }}
            ${{ steps.img.outputs.name }}:${{ github.sha }}

      - name: Generate SeaweedFS S3 config
        env:
          SEAWEEDFS_RAW_BUCKET: ${{ vars.SEAWEEDFS_RAW_BUCKET }}
          SEAWEEDFS_CANONICAL_BUCKET: ${{ vars.SEAWEEDFS_CANONICAL_BUCKET }}
          SEAWEEDFS_PROXY_BUCKET: ${{ vars.SEAWEEDFS_PROXY_BUCKET }}
          SEAWEEDFS_THUMBNAILS_BUCKET: ${{ vars.SEAWEEDFS_THUMBNAILS_BUCKET }}
          SEAWEEDFS_TEMP_BUCKET: ${{ vars.SEAWEEDFS_TEMP_BUCKET }}
          SEAWEEDFS_API_ACCESS_KEY: ${{ vars.SEAWEEDFS_API_ACCESS_KEY }}
          SEAWEEDFS_API_SECRET_KEY: ${{ secrets.SEAWEEDFS_API_SECRET_KEY }}
          SEAWEEDFS_AI_ACCESS_KEY: ${{ vars.SEAWEEDFS_AI_ACCESS_KEY }}
          SEAWEEDFS_AI_SECRET_KEY: ${{ secrets.SEAWEEDFS_AI_SECRET_KEY }}
          SEAWEEDFS_BOOTSTRAP_ACCESS_KEY: ${{ vars.SEAWEEDFS_BOOTSTRAP_ACCESS_KEY }}
          SEAWEEDFS_BOOTSTRAP_SECRET_KEY: ${{ secrets.SEAWEEDFS_BOOTSTRAP_SECRET_KEY }}
        run: |
          mkdir -p infra/seaweedfs
          python3 - <<'PY'
          import json
          import os
          import pathlib

          def optional(name: str, default: str) -> str:
              return os.environ.get(name) or default

          def required(name: str) -> str:
              value = os.environ.get(name)
              if not value:
                  raise SystemExit(f"Missing required secret or variable: {name}")
              return value

          raw_bucket = optional("SEAWEEDFS_RAW_BUCKET", "kuvox-raw")
          canonical_bucket = optional("SEAWEEDFS_CANONICAL_BUCKET", "kuvox-canonical")
          proxy_bucket = optional("SEAWEEDFS_PROXY_BUCKET", "kuvox-proxy")
          thumbnails_bucket = optional("SEAWEEDFS_THUMBNAILS_BUCKET", "kuvox-thumbnails")
          temp_bucket = optional("SEAWEEDFS_TEMP_BUCKET", "kuvox-temp")

          def list_read_write(bucket: str) -> list[str]:
              return [
                  f"List:{bucket}",
                  f"Read:{bucket}",
                  f"Read:{bucket}/*",
                  f"Write:{bucket}",
                  f"Write:{bucket}/*",
              ]

          def list_read(bucket: str) -> list[str]:
              return [f"List:{bucket}", f"Read:{bucket}", f"Read:{bucket}/*"]

          config = {
              "identities": [
                  {
                      "name": "kuvox-api",
                      "credentials": [
                          {
                              "accessKey": optional("SEAWEEDFS_API_ACCESS_KEY", "kuvox-api"),
                              "secretKey": required("SEAWEEDFS_API_SECRET_KEY"),
                          }
                      ],
                      "actions": (
                          list_read_write(raw_bucket)
                          + list_read_write(canonical_bucket)
                          + list_read_write(proxy_bucket)
                          + list_read_write(thumbnails_bucket)
                      ),
                  },
                  {
                      "name": "kuvox-ai",
                      "credentials": [
                          {
                              "accessKey": optional("SEAWEEDFS_AI_ACCESS_KEY", "kuvox-ai"),
                              "secretKey": required("SEAWEEDFS_AI_SECRET_KEY"),
                          }
                      ],
                      "actions": (
                          list_read(raw_bucket)
                          + list_read_write(canonical_bucket)
                          + list_read_write(proxy_bucket)
                          + list_read_write(thumbnails_bucket)
                          + list_read_write(temp_bucket)
                      ),
                  },
                  {
                      "name": "kuvox-bootstrap",
                      "credentials": [
                          {
                              "accessKey": optional("SEAWEEDFS_BOOTSTRAP_ACCESS_KEY", "kuvox-bootstrap"),
                              "secretKey": required("SEAWEEDFS_BOOTSTRAP_SECRET_KEY"),
                          }
                      ],
                      "actions": ["Admin", "List", "Read", "Write"],
                  },
              ]
          }

          path = pathlib.Path("infra/seaweedfs/s3.json")
          path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Copy deployment files to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DROPLET_HOST }}
          username: ${{ vars.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: docker-compose.prod.yml,infra/seaweedfs/s3.json,deploy/redis/redis.conf,deploy/redis/entrypoint-single.sh
          target: /opt/kuvox

      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DROPLET_HOST }}
          username: ${{ vars.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /opt/kuvox
            export GITHUB_OWNER="${{ steps.img.outputs.owner }}"
            export AI_TAG="${{ steps.tag.outputs.tag }}"
            export KUVOX_ENVIRONMENT="${{ steps.tag.outputs.env }}"
            docker compose -f docker-compose.prod.yml config >/dev/null
            docker compose -f docker-compose.prod.yml up -d redis-api redis-ai
            docker compose -f docker-compose.prod.yml pull kuvox-ai
            docker compose -f docker-compose.prod.yml up -d kuvox-ai
            docker image prune -f
