# Production compose for the Kuvox Droplet.
# Place this at /opt/kuvox/docker-compose.prod.yml on the server.
# Environment variables are loaded from /opt/kuvox/.env

services:
  # ---- Application services ---------------------------------------------------
  kuvox-frontend:
    image: ghcr.io/${GITHUB_OWNER}/kuvox-frontend:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    ports:
      # Bound to localhost only — the host Nginx reverse proxy fronts it with TLS.
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      VITE_API_URL: ${VITE_API_URL:-http://kuvox-api:5000}
      API_URL: ${API_URL:-http://kuvox-api:5000}
      VITE_AI_SERVICE_URL: ${VITE_AI_SERVICE_URL:-http://kuvox-ai:8000}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://kuvox-ai:8000}
      KUVOX_MEDIA_INGESTION_ENABLED: "${KUVOX_MEDIA_INGESTION_ENABLED:-false}"
      KUVOX_MEDIA_RETRIEVAL_ENABLED: "${KUVOX_MEDIA_RETRIEVAL_ENABLED:-false}"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      KUVOX_BFF_COALESCING_ENABLED: "${KUVOX_BFF_COALESCING_ENABLED:-false}"
      KUVOX_BFF_COALESCING_RESOURCES: "${KUVOX_BFF_COALESCING_RESOURCES:-auth_me,studio_memberships,retrieval_project_media}"
      KUVOX_BFF_COALESCING_MAX_IN_FLIGHT: "${KUVOX_BFF_COALESCING_MAX_IN_FLIGHT:-256}"
      KUVOX_BFF_COALESCING_DEADLINE_MS: "${KUVOX_BFF_COALESCING_DEADLINE_MS:-5000}"
      KUVOX_BFF_METRICS_ENABLED: "${KUVOX_BFF_METRICS_ENABLED:-false}"
    depends_on:
      - kuvox-api
      - kuvox-ai
    networks:
      - kuvox

  kuvox-api:
    image: ghcr.io/${GITHUB_OWNER}/kuvox-api:${API_TAG:-latest}
    restart: unless-stopped
    ports:
      # Bound to localhost only — the host Nginx reverse proxy fronts it with TLS.
      - "127.0.0.1:5000:5000"
    env_file: .env
    environment:
      KUVOX_MEDIA_INGESTION_ENABLED: "${KUVOX_MEDIA_INGESTION_ENABLED:-false}"
      KUVOX_MEDIA_RETRIEVAL_ENABLED: "${KUVOX_MEDIA_RETRIEVAL_ENABLED:-false}"
      ConnectionStrings__Redis: "redis-api:6379,user=kuvox-api,password=${REDIS_API_PASSWORD:?Set REDIS_API_PASSWORD in .env}"
      Caching__Enabled: "${API_CACHING_ENABLED:-false}"
      Caching__HttpValidatorsEnabled: "${API_HTTP_VALIDATORS_ENABLED:-false}"
      Caching__BusinessReads__Enabled: "${API_BUSINESS_READ_CACHING_ENABLED:-false}"
      Caching__UserSettings__Enabled: "${API_USER_SETTINGS_CACHING_ENABLED:-false}"
      Caching__Studio__Enabled: "${API_STUDIO_CACHING_ENABLED:-false}"
      Caching__Projects__Enabled: "${API_PROJECTS_CACHING_ENABLED:-false}"
      Caching__Media__Enabled: "${API_MEDIA_CACHING_ENABLED:-false}"
      Caching__Albums__Enabled: "${API_ALBUMS_CACHING_ENABLED:-false}"
      Caching__StorageUsage__Enabled: "${API_STORAGE_USAGE_CACHING_ENABLED:-false}"
      Caching__Tasks__Enabled: "${API_TASKS_CACHING_ENABLED:-false}"
      Caching__Notifications__Enabled: "${API_NOTIFICATION_PAGES_CACHING_ENABLED:-false}"
      Caching__NotificationCount__Enabled: "${API_NOTIFICATION_COUNT_CACHING_ENABLED:-false}"
      Caching__EditorDocuments__Enabled: "${API_EDITOR_DOCUMENTS_CACHING_ENABLED:-false}"
      Caching__RenderJobs__Enabled: "${API_RENDER_JOBS_CACHING_ENABLED:-false}"
      Caching__StampedeProtectionEnabled: "${API_STAMPEDE_PROTECTION_ENABLED:-false}"
      Caching__StudioUsageSingleFlightEnabled: "${API_STUDIO_USAGE_SINGLE_FLIGHT_ENABLED:-false}"
      Caching__LockTtlMilliseconds: "${API_LOCK_TTL_MILLISECONDS:-5000}"
      Caching__LockWaitMilliseconds: "${API_LOCK_WAIT_MILLISECONDS:-2000}"
      Caching__LockPollMilliseconds: "${API_LOCK_POLL_MILLISECONDS:-50}"
      Caching__StudioSettingsPrewarmEnabled: "${API_STUDIO_SETTINGS_PREWARM_ENABLED:-false}"
      Caching__TaskReferencePrewarmEnabled: "${API_TASK_REFERENCE_PREWARM_ENABLED:-false}"
      Caching__PrewarmQueueCapacity: "${API_PREWARM_QUEUE_CAPACITY:-256}"
      Caching__PrewarmStartupDelayMilliseconds: "${API_PREWARM_STARTUP_DELAY_MILLISECONDS:-5000}"
      Caching__PrewarmStartupStudioIds__0: "${API_PREWARM_STARTUP_STUDIO_ID_0:-}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-api:
        condition: service_healthy
    networks:
      - kuvox

  kuvox-ai:
    image: ghcr.io/${GITHUB_OWNER}/kuvox-ai:${AI_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      KUVOX_HOST: "0.0.0.0"
      KUVOX_PORT: "8000"
      KUVOX_ENVIRONMENT: "${KUVOX_ENVIRONMENT:-production}"
      KUVOX_RUN_WORKERS: "${KUVOX_RUN_WORKERS:-true}"
      KUVOX_MEDIA_INGESTION_ENABLED: "${KUVOX_MEDIA_INGESTION_ENABLED:-false}"
      KUVOX_MEDIA_RETRIEVAL_ENABLED: "${KUVOX_MEDIA_RETRIEVAL_ENABLED:-false}"
      KUVOX_QDRANT_HOST: "qdrant"
      KUVOX_QDRANT_PORT: "6333"
      KUVOX_REDIS_URL: "redis://redis-ai:6379/0"
      KUVOX_REDIS_USERNAME: "kuvox-ai"
      KUVOX_REDIS_PASSWORD: "${REDIS_AI_PASSWORD:?Set REDIS_AI_PASSWORD in .env}"
      KUVOX_CACHE_ENABLED: "${KUVOX_CACHE_ENABLED:-false}"
      KUVOX_CACHE_KEY_PREFIX: "${KUVOX_CACHE_KEY_PREFIX:-kuvox:v1}"
      KUVOX_CACHE_TTL_JITTER_PERCENT: "${KUVOX_CACHE_TTL_JITTER_PERCENT:-10}"
      KUVOX_CACHE_MAX_PAYLOAD_BYTES: "${KUVOX_CACHE_MAX_PAYLOAD_BYTES:-1048576}"
      KUVOX_QUERY_EMBEDDING_CACHE_ENABLED: "${KUVOX_QUERY_EMBEDDING_CACHE_ENABLED:-false}"
      KUVOX_QUERY_EMBEDDING_SINGLE_FLIGHT_ENABLED: "${KUVOX_QUERY_EMBEDDING_SINGLE_FLIGHT_ENABLED:-false}"
      KUVOX_INGESTION_TEXT_EMBEDDING_CACHE_ENABLED: "${KUVOX_INGESTION_TEXT_EMBEDDING_CACHE_ENABLED:-false}"
      KUVOX_TEXT_EMBEDDING_CACHE_TTL_SECONDS: "${KUVOX_TEXT_EMBEDDING_CACHE_TTL_SECONDS:-604800}"
      KUVOX_TEXT_EMBEDDING_CACHE_BUDGET_BYTES: "${KUVOX_TEXT_EMBEDDING_CACHE_BUDGET_BYTES:-100663296}"
      KUVOX_TEXT_EMBEDDING_CACHE_LEGACY_READ_ENABLED: "${KUVOX_TEXT_EMBEDDING_CACHE_LEGACY_READ_ENABLED:-true}"
      KUVOX_VISUAL_EMBEDDING_CACHE_ENABLED: "${KUVOX_VISUAL_EMBEDDING_CACHE_ENABLED:-false}"
      KUVOX_VISUAL_EMBEDDING_CACHE_TTL_SECONDS: "${KUVOX_VISUAL_EMBEDDING_CACHE_TTL_SECONDS:-86400}"
      KUVOX_VISUAL_EMBEDDING_CACHE_BUDGET_BYTES: "${KUVOX_VISUAL_EMBEDDING_CACHE_BUDGET_BYTES:-33554432}"
      KUVOX_AUDIO_EMBEDDING_CACHE_ENABLED: "${KUVOX_AUDIO_EMBEDDING_CACHE_ENABLED:-false}"
      KUVOX_AUDIO_EMBEDDING_CACHE_TTL_SECONDS: "${KUVOX_AUDIO_EMBEDDING_CACHE_TTL_SECONDS:-86400}"
      KUVOX_AUDIO_EMBEDDING_CACHE_BUDGET_BYTES: "${KUVOX_AUDIO_EMBEDDING_CACHE_BUDGET_BYTES:-67108864}"
      KUVOX_RETRIEVAL_CACHE_ENABLED: "${KUVOX_RETRIEVAL_CACHE_ENABLED:-false}"
      KUVOX_RETRIEVAL_CACHE_TTL_SECONDS: "${KUVOX_RETRIEVAL_CACHE_TTL_SECONDS:-60}"
      KUVOX_RETRIEVAL_CACHE_BUDGET_BYTES: "${KUVOX_RETRIEVAL_CACHE_BUDGET_BYTES:-67108864}"
      KUVOX_RETRIEVAL_SINGLE_FLIGHT_ENABLED: "${KUVOX_RETRIEVAL_SINGLE_FLIGHT_ENABLED:-false}"
      KUVOX_SINGLE_FLIGHT_LOCK_TTL_SECONDS: "${KUVOX_SINGLE_FLIGHT_LOCK_TTL_SECONDS:-30}"
      KUVOX_SINGLE_FLIGHT_WAIT_SECONDS: "${KUVOX_SINGLE_FLIGHT_WAIT_SECONDS:-15}"
      KUVOX_SINGLE_FLIGHT_POLL_MILLISECONDS: "${KUVOX_SINGLE_FLIGHT_POLL_MILLISECONDS:-50}"
      KUVOX_RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-kuvox}:${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}@rabbitmq:5672/"
      KUVOX_S3_ENDPOINT_URL: "http://seaweedfs-s3:8333"
      KUVOX_MEDIA_WORK_DIR: "/tmp/kuvox-media"
      KUVOX_INGESTION_WORK_DIR: "/tmp/kuvox-ingestion"
      KUVOX_KUZU_DB_PATH: "./data/kuzu"
      KUVOX_MODEL_DIR: "./data/models"
    volumes:
      # Persists the embedded Kuzu graph DB + model files across redeploys.
      - kuzu-data:/app/data
    depends_on:
      redis-ai:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seaweedfs-master:
        condition: service_started
      seaweedfs-volume:
        condition: service_started
      seaweedfs-s3:
        condition: service_started
      seaweedfs-filer:
        condition: service_started
    networks:
      - kuvox

  # ---- Infrastructure services ------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kuvox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kuvox}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kuvox}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - kuvox

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - kuvox

  redis-api:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-api-data:/data
      - ./deploy/redis/redis.conf:/etc/redis/redis.conf:ro
      - ./deploy/redis/entrypoint-single.sh:/usr/local/bin/kuvox-redis-entrypoint:ro
    environment:
      REDIS_USERNAME: kuvox-api
      REDIS_PASSWORD: ${REDIS_API_PASSWORD:?Set REDIS_API_PASSWORD in .env}
      REDIS_KEY_PATTERN: kuvox:v1:api:*
      REDIS_MAXMEMORY: 128mb
    entrypoint: ["/usr/local/bin/kuvox-redis-entrypoint"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user kuvox-api -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - kuvox

  redis-ai:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-ai-data:/data
      - ./deploy/redis/redis.conf:/etc/redis/redis.conf:ro
      - ./deploy/redis/entrypoint-single.sh:/usr/local/bin/kuvox-redis-entrypoint:ro
    environment:
      REDIS_USERNAME: kuvox-ai
      REDIS_PASSWORD: ${REDIS_AI_PASSWORD:?Set REDIS_AI_PASSWORD in .env}
      REDIS_KEY_PATTERN: kuvox:v1:ai:*
      REDIS_MAXMEMORY: 384mb
    entrypoint: ["/usr/local/bin/kuvox-redis-entrypoint"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user kuvox-ai -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - kuvox

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-kuvox}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kuvox

  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9333:9333"    # Master HTTP
      - "127.0.0.1:19333:19333"    # Master gRPC
    command: master -mdir=/data
    volumes:
      - seaweedfs_master:/data
    networks:
      - kuvox

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
    command: volume -mserver=seaweedfs-master:9333 -dir=/data -port=8123
    volumes:
      - seaweedfs_volume:/data
    depends_on:
      - seaweedfs-master
    networks:
      - kuvox

  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8333:8333"    # S3-compatible API endpoint
    command: s3 -config=/etc/seaweedfs/s3.json -filer=seaweedfs-filer:8888
    volumes:
      - ./infra/seaweedfs:/etc/seaweedfs:ro
    depends_on:
      - seaweedfs-filer
    networks:
      - kuvox

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8888"
    command: filer -master=seaweedfs-master:9333
    volumes:
      - seaweedfs_filer:/data
    depends_on:
      - seaweedfs-master
    networks:
      - kuvox

volumes:
  postgres-data:
  qdrant-data:
  redis-api-data:
  redis-ai-data:
  rabbitmq-data:
  seaweedfs_master:
  seaweedfs_volume:
  seaweedfs_filer:
  kuzu-data:

networks:
  kuvox:
    driver: bridge
