# Self-contained local development infrastructure for the Kuvox AI service ALONE.
# The service itself is NOT started here — run `make dev` for that.
#
# Qdrant is owned by this service; Redis / RabbitMQ / MinIO are provided here so the
# ai-service can be developed standalone without the api repo checked out.
#
# >>> If you develop BOTH api/ and ai-service/ together, do NOT run this file. <<<
# Use the workspace-root docker-compose.yml (`cd .. && make up`) instead — it brings up
# a single shared infra set. This file and the api compose both publish Redis (6379),
# RabbitMQ (5672/15672) and MinIO (9000/9001), so running more than one infra set at
# once collides on those host ports. Run exactly one set, never two.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # Qdrant images don't ship curl/wget; use the busybox-style TCP probe via bash.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  qdrant-data:
  redis-data:
  rabbitmq-data:
  minio-data:
