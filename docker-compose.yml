# Self-contained local development infrastructure for the Kuvox AI service ALONE.
# The service itself is NOT started here — run `make dev` for that.
#
# Qdrant is owned by this service; Redis / RabbitMQ / SeaweedFS are provided here so the
# ai-service can be developed standalone without the api repo checked out.
#
# >>> If you develop BOTH api/ and ai-service/ together, do NOT run this file. <<<
# Use the workspace-root docker-compose.yml (`cd .. && make up`) instead — it brings up
# a single shared infra set. This file and the api compose both publish Redis (6379),
# RabbitMQ (5672/15672) and SeaweedFS (8333), so running more than one infra set at
# once collides on those host ports. Run exactly one set, never two.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # Qdrant images don't ship curl/wget; use the busybox-style TCP probe via bash.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs_master
    restart: unless-stopped
    ports:
      - "9333:9333"    # Master HTTP
      - "19333:19333"    # Master gRPC
    command: master -mdir=/data
    volumes:
      - seaweedfs_master:/data
  
  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-volume
    restart: unless-stopped
    ports:
      - "8123:8123"
    command: volume -mserver=seaweedfs-master:9333 -dir=/data -port=8123
    volumes:
      - seaweedfs_volume:/data
    depends_on:
      - seaweedfs-master

  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs_s3
    restart: unless-stopped
    ports:
      - "8333:8333"    # S3-compatible API endpoint
    command: s3 -filer=seaweedfs-filer:8888
    depends_on:
      - seaweedfs-filer

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs_filer
    restart: unless-stopped
    ports:
      - "8888:8888"
    command: filer -master=seaweedfs-master:9333
    volumes:
      - seaweedfs_filer:/data
    depends_on:
      - seaweedfs-master

volumes:
  qdrant-data:
  redis-data:
  rabbitmq-data:
  seaweedfs_master:
  seaweedfs_volume:
  seaweedfs_filer:
